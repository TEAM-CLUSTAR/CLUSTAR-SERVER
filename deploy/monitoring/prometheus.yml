global:
  scrape_interval: 30s
  evaluation_interval: 30s
scrape_configs:
  - job_name: host
    static_configs:
      - targets: [node-exporter:9100]
  - job_name: containers
    static_configs:
      - targets: [cadvisor:8080]
  - job_name: spring
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [app-blue:8080, app-green:8080]
  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

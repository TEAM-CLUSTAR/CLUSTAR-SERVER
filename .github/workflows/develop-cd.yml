name: develop-cd

on:
  push:
    branches: [develop]
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'deploy/lightsail/**'
      - '.github/workflows/develop-cd.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clustar-lightsail-develop
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Build versioned image archive
        run: |
          ./gradlew --no-daemon jibBuildTar -PjibToImage="clustar:$GITHUB_SHA" -PjibTag="$GITHUB_SHA"
          gzip -1 build/jib-image.tar

      - name: Upload and deploy to Lightsail
        shell: bash
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          LIGHTSAIL_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          SWAGGER_USERNAME: ${{ secrets.SWAGGER_USERNAME }}
          SWAGGER_PASSWORD: ${{ secrets.SWAGGER_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.LIGHTSAIL_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.LIGHTSAIL_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          umask 077
          tmp=$(mktemp -d)
          remote_dir=
          cleanup() {
            if [[ -n $remote_dir ]]; then
              ssh "${ssh_options[@]}" "$target" \
                "cd '$remote_dir' && rm -f -- compose.yaml deploy.sh jib-image.tar.gz runtime.env && cd .. && rmdir '$remote_dir'" || true
            fi
            rm -f -- "$tmp/key" "$tmp/known_hosts" "$tmp/runtime.env"
            rmdir "$tmp"
          }
          trap cleanup EXIT
          : "${LIGHTSAIL_HOST:?GitHub secret LIGHTSAIL_HOST is required}"
          [[ $LIGHTSAIL_HOST =~ ^[a-zA-Z0-9.-]+$ ]]
          : "${LIGHTSAIL_SSH_KEY:?GitHub secret LIGHTSAIL_SSH_KEY is required}"
          : "${LIGHTSAIL_KNOWN_HOSTS:?GitHub secret LIGHTSAIL_KNOWN_HOSTS is required}"
          printf '%s\n' "$LIGHTSAIL_SSH_KEY" > "$tmp/key"
          printf '%s\n' "$LIGHTSAIL_KNOWN_HOSTS" > "$tmp/known_hosts"
          ssh_options=(-i "$tmp/key" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=10
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$tmp/known_hosts")
          target="ubuntu@$LIGHTSAIL_HOST"

          write_env() {
            local key=$1 value=${!1}
            if [[ -z $value || $value == *$'\n'* || $value == *$'\r'* ]]; then
              echo "::error::$key must be a non-empty, single-line value"
              exit 1
            fi
            printf '%s=%s\n' "$key" "$value" >> "$tmp/runtime.env"
          }
          for key in JWT_SECRET_KEY GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REDIRECT_URI \
              GOOGLE_AI_API_KEY SWAGGER_USERNAME SWAGGER_PASSWORD; do
            write_env "$key"
          done
          if [[ -n $AWS_ACCESS_KEY_ID || -n $AWS_SECRET_ACCESS_KEY ]]; then
            write_env AWS_ACCESS_KEY_ID
            write_env AWS_SECRET_ACCESS_KEY
          fi

          upload_path=$(ssh "${ssh_options[@]}" "$target" 'mktemp -d /opt/clustar/incoming/deploy.XXXXXXXX')
          [[ $upload_path =~ ^/opt/clustar/incoming/deploy\.[A-Za-z0-9]{8}$ ]]
          remote_dir=$upload_path
          scp "${ssh_options[@]}" deploy/lightsail/{compose.yaml,deploy.sh} \
            build/jib-image.tar.gz "$tmp/runtime.env" "$target:$remote_dir/"
          ssh "${ssh_options[@]}" "$target" \
            "bash '$remote_dir/deploy.sh' release '$GITHUB_SHA' '$remote_dir/jib-image.tar.gz' '$remote_dir/runtime.env'"

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ -n "$DISCORD_WEBHOOK" ]]; then
            jq -n --arg message "CLUSTAR DEV deployment: $STATUS ($RUN_URL)" '{content: $message}' |
              curl --fail --silent --show-error --max-time 20 -H 'Content-Type: application/json' \
                --data-binary @- "$DISCORD_WEBHOOK" || echo 'Discord notification failed' >&2
          fi
